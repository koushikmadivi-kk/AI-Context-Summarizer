<!DOCTYPE html>
<html>
<head>
<title>AI Context Summarizer</title>

<style>

body{
font-family:Arial;
background:linear-gradient(135deg,#4f46e5,#9333ea);
height:100vh;
display:flex;
justify-content:center;
align-items:center;
margin:0;
}

.container{
background:white;
padding:40px;
border-radius:12px;
width:700px;
box-shadow:0 10px 30px rgba(0,0,0,0.2);
}

h1{
text-align:center;
margin-bottom:25px;
}

textarea{
width:100%;
height:180px;
padding:12px;
border-radius:8px;
border:1px solid #ccc;
font-size:15px;
resize:none;
}

button{
margin-top:15px;
width:100%;
padding:12px;
background:#4f46e5;
border:none;
color:white;
font-size:16px;
border-radius:8px;
cursor:pointer;
}

button:hover{
background:#3730a3;
}

.section{
margin-top:25px;
}

.output{
padding:15px;
background:#f3f4f6;
border-radius:8px;
min-height:60px;
white-space:pre-wrap;
}

.loading{
display:none;
margin-top:10px;
text-align:center;
}

</style>
</head>

<body>

<div class="container">

<h1>AI Context Summarizer</h1>

<textarea id="text" placeholder="Paste your text here..."></textarea>

<button onclick="summarizeText()">Summarize</button>

<div id="loading" class="loading">Summarizing...</div>

<div class="section">
<h3>Summary</h3>
<div id="summary" class="output"></div>
</div>

<div class="section">
<h3>Generated Q&A</h3>
<div id="qa" class="output"></div>
</div>

</div>

<script>

async function summarizeText(){

let text=document.getElementById("text").value

if(!text){
alert("Please enter text")
return
}

document.getElementById("loading").style.display="block"

try{

let response=await fetch("/summarize_text",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({text:text})
})

let data=await response.json()

document.getElementById("loading").style.display="none"

if(data.status==="success"){

document.getElementById("summary").innerText=data.summary
document.getElementById("qa").innerText=data.qa

}else{

document.getElementById("summary").innerText=data.error || data.message

}

}catch(err){

document.getElementById("loading").style.display="none"
document.getElementById("summary").innerText="Server error"

}

}

</script>

</body>
</html>
